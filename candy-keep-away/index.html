<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Candy Keep Away</title>
<style>
:root{
  --ink:#171321;
  --paper:#f7ead7;
  --paper2:#efe0ca;
  --pink:#df789d;
  --pink2:#bf5f83;
  --yellow:#e8c76f;
  --wood:#6d493c;
  --muted:#6f6673;
  font-family:"Courier New","Noto Sans KR",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#2c2130;color:var(--ink)}
body{
  background:
    linear-gradient(180deg,#39283b 0 150px,#241c2a 150px 100%);
}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.wrap{max-width:900px;margin:0 auto;padding:10px 10px 34px}

.top{
  display:grid;
  grid-template-columns:minmax(210px,1fr) auto;
  gap:10px;
  align-items:end;
  margin-bottom:9px
}
.brand{
  min-width:0;
  border:3px solid var(--ink);
  background:var(--paper);
  box-shadow:4px 4px 0 var(--ink);
  padding:10px 13px 9px
}
.brand h1{
  margin:0;
  font-size:clamp(24px,5vw,42px);
  line-height:.9;
  letter-spacing:-2px;
  color:var(--ink);
  text-shadow:none
}
.brand p{
  margin:7px 0 0;
  color:#675b65;
  font-size:9px;
  line-height:1.45
}
.stats{
  display:grid;
  grid-template-columns:repeat(3,88px) 88px;
  gap:6px
}
.stat,.sound{
  min-height:58px;
  border:3px solid var(--ink);
  box-shadow:3px 3px 0 var(--ink);
  background:var(--paper);
  color:var(--ink);
  padding:6px 7px;
  text-align:center
}
.stat span{
  display:block;
  font-size:8px;
  letter-spacing:.7px;
  color:#786b73
}
.stat strong{
  display:block;
  margin-top:2px;
  font-size:18px;
  color:var(--ink)
}
.sound{
  background:var(--yellow);
  font-size:9px;
  font-weight:1000;
  line-height:1.15
}
.sound.off{background:#c8bdad;color:#6f6673}

.gamebox{
  position:relative;
  border:4px solid var(--ink);
  box-shadow:5px 5px 0 var(--ink);
  background:#6b473b;
  overflow:hidden
}
#game{
  display:block;
  width:100%;
  height:auto;
  max-height:760px;
  touch-action:none;
  background:#704a3d
}

.overlay{
  position:absolute;
  inset:0;
  z-index:10;
  display:grid;
  place-items:center;
  padding:16px;
  background:rgba(23,19,33,.58)
}
.card{
  width:min(410px,100%);
  border:4px solid var(--ink);
  box-shadow:6px 6px 0 var(--ink);
  background:var(--paper);
  padding:16px;
  text-align:center
}
.card h2{
  margin:0 0 8px;
  color:var(--ink);
  font-size:27px;
  line-height:1;
  text-shadow:none
}
.card p{
  margin:8px 0;
  color:#675b65;
  font-size:10px;
  line-height:1.55
}
.field{text-align:left;margin:12px 0}
.field label{
  display:block;
  margin-bottom:5px;
  font-size:9px;
  color:#5f505b;
  font-weight:1000
}
.field input{
  width:100%;
  border:3px solid var(--ink);
  box-shadow:none;
  background:#fffaf0;
  color:var(--ink);
  padding:10px 11px;
  font-size:15px;
  outline:none
}
.field input:focus{background:#fff}

.btn{
  width:100%;
  border:3px solid var(--ink);
  box-shadow:3px 3px 0 var(--ink);
  background:var(--pink);
  color:var(--ink);
  padding:10px 12px;
  font-weight:1000
}
.btn:hover{background:#e68cac}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.actions .btn:nth-child(2){background:#d9cfbf}

.result{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin:12px 0
}
.result div{
  border:2px solid var(--ink);
  background:#fff8ec;
  padding:8px
}
.result span{display:block;font-size:8px;color:#7b6f75}
.result strong{display:block;font-size:18px;margin-top:3px;color:var(--ink)}

.tipbar{
  position:absolute;
  left:50%;
  bottom:10px;
  transform:translateX(-50%);
  z-index:4;
  border:3px solid var(--ink);
  background:var(--paper);
  box-shadow:3px 3px 0 var(--ink);
  padding:7px 12px;
  font-size:9px;
  font-weight:1000;
  color:var(--ink);
  pointer-events:none;
  white-space:nowrap
}

.ranks{
  margin-top:11px;
  border:3px solid var(--ink);
  box-shadow:4px 4px 0 var(--ink);
  background:var(--paper);
  padding:11px 12px
}
.ranks h2{
  margin:0 0 7px;
  font-size:12px;
  color:var(--ink)
}
.ranklist{display:grid}
.rank{
  display:grid;
  grid-template-columns:28px 1fr auto;
  gap:8px;
  align-items:center;
  border-top:1px dashed #a69793;
  padding:7px 2px;
  font-size:10px
}
.rank:first-child{border-top:0}
.rank b{color:var(--pink2)}
.rank strong{color:var(--ink)}
.note{
  color:#7d7277;
  font-size:8px;
  line-height:1.45;
  margin-top:6px
}

@media(max-width:720px){
  .wrap{padding:7px 7px 28px}
  .top{grid-template-columns:1fr}
  .brand{padding:9px 10px 8px}
  .brand h1{font-size:30px;line-height:.92}
  .brand p{font-size:8px}
  .stats{grid-template-columns:repeat(4,1fr)}
  .stat,.sound{min-height:54px;padding:5px 4px}
  .stat strong{font-size:16px}
  .sound{font-size:8px}
  .card{padding:14px}
  .card h2{font-size:24px}
  .tipbar{bottom:8px}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div class="brand">
      <h1>CANDY KEEP AWAY</h1>
      <p>사탕을 잡고 도망치세요. 오래 버틸수록 손이 늘어납니다.</p>
    </div>
    <div class="stats">
      <div class="stat"><span>TIME</span><strong id="time">0.00</strong></div>
      <div class="stat"><span>DODGE</span><strong id="dodge">0</strong></div>
      <div class="stat"><span>BEST</span><strong id="best">0.00</strong></div>
      <button id="soundBtn" class="sound" type="button">♪ SOUND ON</button>
    </div>
  </header>

  <section class="gamebox">
    <canvas id="game" width="760" height="760"></canvas>
    <div id="tipbar" class="tipbar">사탕을 잡고 움직이세요</div>

    <div id="startOverlay" class="overlay">
      <div class="card">
        <h2>사탕 뺏기지 마</h2>
        <p>사탕을 끌고 도망치세요.<br>악마 손에 닿으면 끝.</p>
        <div class="field">
          <label>밴드 닉네임</label>
          <input id="nickname" maxlength="24" autocomplete="off" placeholder="닉네임 입력">
        </div>
        <button id="startBtn" class="btn" type="button">GAME START</button>
        <p class="note">현재 랭킹은 이 기기에 저장되는 테스트 기록입니다.</p>
      </div>
    </div>

    <div id="overOverlay" class="overlay hidden">
      <div class="card">
        <h2>뺏겼다!</h2>
        <div class="result">
          <div><span>SURVIVAL</span><strong id="rTime">0.00초</strong></div>
          <div><span>DODGE</span><strong id="rDodge">0</strong></div>
          <div><span>MAX HANDS</span><strong id="rHands">1</strong></div>
          <div><span>MY BEST</span><strong id="rBest">0.00초</strong></div>
        </div>
        <div class="actions">
          <button id="retryBtn" class="btn" type="button">다시 하기</button>
          <button id="homeBtn" class="btn" type="button">처음으로</button>
        </div>
      </div>
    </div>
  </section>

  <section class="ranks">
    <h2>이 기기 최고 기록</h2>
    <div id="ranklist" class="ranklist"></div>
    <div class="note">같은 닉네임으로 다시 플레이하면 더 오래 버틴 기록만 남습니다.</div>
  </section>
</main>

<script>
(function(){
"use strict";
var cv=document.getElementById("game"),ctx=cv.getContext("2d");
ctx.imageSmoothingEnabled=true;
var W=cv.width,H=cv.height;
var timeEl=document.getElementById("time"),dodgeEl=document.getElementById("dodge"),bestEl=document.getElementById("best");
var startOverlay=document.getElementById("startOverlay"),overOverlay=document.getElementById("overOverlay");
var nickname=document.getElementById("nickname"),ranklist=document.getElementById("ranklist"),soundBtn=document.getElementById("soundBtn");
var tipbar=document.getElementById("tipbar");
var STORAGE="candy_keep_away_scores_v1";
var state=null,last=0,raf=0;
var audioCtx=null,master=null,soundOn=true,bgmTimer=null,bgmStep=0;
try{soundOn=localStorage.getItem("candy_keep_away_sound_v1")!=="off"}catch(e){}

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function dist(ax,ay,bx,by){var dx=ax-bx,dy=ay-by;return Math.sqrt(dx*dx+dy*dy)}
function easeOut(t){return 1-Math.pow(1-t,3)}
function easeInOut(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
function norm(x,y){var d=Math.sqrt(x*x+y*y)||1;return{x:x/d,y:y/d}}
function safeRead(){try{return JSON.parse(localStorage.getItem(STORAGE)||"[]")}catch(e){return[]}}
function safeWrite(v){try{localStorage.setItem(STORAGE,JSON.stringify(v))}catch(e){}}
function cleanName(s){return String(s||"").replace(/\s+/g," ").trim().slice(0,24)}
function fmt(t){return Math.max(0,t).toFixed(2)}
function updateHud(){
  if(!state)return;
  timeEl.textContent=fmt(state.elapsed);
  dodgeEl.textContent=state.dodges;
  var rec=getBest(state.name);bestEl.textContent=rec?fmt(rec.time):"0.00";
}
function getBest(name){
  var key=cleanName(name).replace(/\s+/g,"").toLowerCase();
  return safeRead().find(function(x){return x.key===key})||null;
}
function saveScore(){
  var rows=safeRead(),key=state.name.replace(/\s+/g,"").toLowerCase(),r=rows.find(function(x){return x.key===key});
  var rec={key:key,name:state.name,time:state.elapsed,dodges:state.dodges,maxHands:state.maxHands,at:Date.now()};
  if(!r)rows.push(rec);else if(rec.time>r.time)Object.assign(r,rec);
  rows.sort(function(a,b){return b.time-a.time||b.dodges-a.dodges});safeWrite(rows.slice(0,30));
}
function renderRanks(){
  var rows=safeRead().slice(0,10);ranklist.innerHTML="";
  if(!rows.length){ranklist.innerHTML='<div class="note">아직 기록이 없습니다.</div>';return}
  rows.forEach(function(r,i){
    var d=document.createElement("div");d.className="rank";
    d.innerHTML="<b>"+(i+1)+"</b><span>"+escapeHTML(r.name)+"</span><strong>"+fmt(r.time)+"초</strong>";
    ranklist.appendChild(d);
  });
}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,function(ch){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]})}

function buildAudio(){
  if(audioCtx)return;
  var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  audioCtx=new AC();master=audioCtx.createGain();master.gain.value=.55;master.connect(audioCtx.destination);
}
function unlockAudio(done){
  if(!soundOn){if(done)done();return}buildAudio();if(!audioCtx){if(done)done();return}
  var f=function(){if(done)done()};if(audioCtx.state==="running"){f();return}
  var p=audioCtx.resume();if(p&&p.then)p.then(f).catch(f);else f();
}
function tone(freq,dur,vol,type,delay,slide){
  if(!soundOn)return;unlockAudio(function(){
    var o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+(delay||0);
    o.type=type||"triangle";o.frequency.setValueAtTime(freq,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.08,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.03);
  });
}
function sfx(name){
  if(name==="grab"){tone(420,.08,.10,"square",0,260)}
  else if(name==="whoosh"){tone(180,.13,.08,"sawtooth",0,90)}
  else if(name==="dodge"){tone(620,.08,.07,"triangle");tone(820,.09,.05,"sine",.05)}
  else if(name==="caught"){tone(190,.18,.12,"sawtooth",0,90);tone(95,.3,.10,"triangle",.14,45)}
  else if(name==="start"){tone(392,.09,.08,"triangle");tone(523,.12,.08,"triangle",.08)}
}
var bgmNotes=[196,220,233.08,261.63,233.08,220,196,174.61,196,220,261.63,293.66];
function bgmPulse(){
  if(!state||!state.running||!soundOn)return;
  var n=bgmNotes[bgmStep%bgmNotes.length];bgmStep++;
  tone(n,.18,.018,"triangle");if(bgmStep%3===1)tone(n/2,.28,.011,"sine");
}
function startBgm(){stopBgm();if(!soundOn)return;bgmStep=0;bgmPulse();bgmTimer=setInterval(bgmPulse,290)}
function stopBgm(){if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null}}
function updateSound(){soundBtn.textContent=soundOn?"♪ SOUND ON":"♪ SOUND OFF";soundBtn.classList.toggle("off",!soundOn)}
soundBtn.onclick=function(e){e.stopPropagation();soundOn=!soundOn;try{localStorage.setItem("candy_keep_away_sound_v1",soundOn?"on":"off")}catch(err){};if(soundOn){unlockAudio(function(){sfx("start");if(state&&state.running)startBgm()})}else stopBgm();updateSound()};
updateSound();

function newCandy(){
  return{x:W*.5,y:H*.62,r:28,drag:false,targetX:W*.5,targetY:H*.62,vx:0,vy:0,lastX:W*.5,lastY:H*.62};
}
var HAND_COLORS=["#7f6aa8","#6f9a7b","#b56d72","#b38a57"];
function edgePoint(side,u){
  var pad=12;
  if(side===0)return{x:lerp(80,W-80,u),y:-pad};
  if(side===1)return{x:W+pad,y:lerp(90,H-130,u)};
  if(side===2)return{x:lerp(W-80,80,u),y:H+pad};
  return{x:-pad,y:lerp(H-130,90,u)};
}
function createHand(side){
  var anchor=edgePoint(side,.18+Math.random()*.64);
  return{
    side:side,ax:anchor.x,ay:anchor.y,color:HAND_COLORS[side%HAND_COLORS.length],
    phase:"wait",timer:.35+Math.random()*.8,telegraph:.42,strikeDur:.34,retractDur:.28,
    p:0,tx:W/2,ty:H/2,tipX:anchor.x,tipY:anchor.y,
    didCount:false,feint:false,reAim:false,
    pattern:"straight",amp:0,spin:1,waves:2
  };
}
function desiredHandCount(t){
  if(t<10)return 1;if(t<22)return 2;if(t<36)return 3;return 4;
}
function pickPattern(t){
  var pool;
  if(t<8)pool=["straight","straight","curve"];
  else if(t<18)pool=["straight","curve","curve","s","hook"];
  else pool=["straight","curve","s","hook","spiral","spiral"];
  return pool[Math.floor(Math.random()*pool.length)];
}
function attackSetup(h){
  var c=state.candy,t=state.elapsed;
  var predict=Math.min(.36,.10+t*.006);
  var tx=c.x+c.vx*predict,ty=c.y+c.vy*predict;
  var error=Math.max(7,28-t*.5);
  tx+=(-error+Math.random()*error*2);ty+=(-error+Math.random()*error*2);
  tx=clamp(tx,45,W-45);ty=clamp(ty,55,H-70);
  h.pattern=pickPattern(t);
  h.amp=(h.pattern==="straight")?0:(45+Math.random()*55);
  if(h.pattern==="spiral")h.amp=58+Math.random()*45;
  h.spin=Math.random()<.5?-1:1;
  h.waves=2+Math.floor(Math.random()*2);
  h.feint=t>16&&Math.random()<Math.min(.28,(t-16)*.01);
  h.tx=tx;h.ty=ty;h.p=0;h.didCount=false;h.reAim=false;
  h.telegraph=Math.max(.20,.48-t*.0055);
  h.strikeDur=Math.max(.19,.39-t*.0038);
  if(h.pattern==="spiral")h.strikeDur*=1.12;
  h.retractDur=.24;
  h.phase="aim";h.timer=h.telegraph;
}
function motionTip(h,q){
  var x=lerp(h.ax,h.tx,q),y=lerp(h.ay,h.ty,q);
  var dx=h.tx-h.ax,dy=h.ty-h.ay,n=norm(dx,dy),px=-n.y,py=n.x;
  var off=0;
  if(h.pattern==="curve")off=Math.sin(Math.PI*q)*h.amp*h.spin;
  else if(h.pattern==="s")off=Math.sin(Math.PI*2*q)*h.amp*h.spin;
  else if(h.pattern==="hook")off=Math.sin(Math.PI*q)*h.amp*h.spin*(.35+q*.85);
  else if(h.pattern==="spiral")off=Math.sin(Math.PI*4*q)*h.amp*h.spin*(1-q*.55);
  x+=px*off;y+=py*off;
  return{x:x,y:y};
}
function updateHand(h,dt){
  if(h.phase==="wait"){
    h.timer-=dt;if(h.timer<=0)attackSetup(h);return;
  }
  if(h.phase==="aim"){
    h.timer-=dt;
    if(h.feint&&h.timer<h.telegraph*.45&&!h.reAim){
      h.reAim=true;
      var c=state.candy,pred=.12+Math.min(.14,state.elapsed*.0035);
      h.tx=clamp(c.x+c.vx*pred,45,W-45);h.ty=clamp(c.y+c.vy*pred,55,H-70);
    }
    if(h.timer<=0){h.phase="strike";h.p=0;sfx("whoosh")}
    return;
  }
  if(h.phase==="strike"){
    h.p+=dt/h.strikeDur;
    var q=easeOut(clamp(h.p,0,1)),pt=motionTip(h,q);
    h.tipX=pt.x;h.tipY=pt.y;
    var c=state.candy;
    if(h.p>.32&&dist(h.tipX,h.tipY,c.x,c.y)<c.r+26){endGame();return}
    if(h.p>=1){h.tipX=h.tx;h.tipY=h.ty;h.phase="hold";h.timer=.055}
    return;
  }
  if(h.phase==="hold"){
    h.timer-=dt;if(h.timer<=0){h.phase="retract";h.p=0}return;
  }
  if(h.phase==="retract"){
    h.p+=dt/h.retractDur;var q=easeInOut(clamp(h.p,0,1));
    h.tipX=lerp(h.tx,h.ax,q);h.tipY=lerp(h.ty,h.ay,q);
    if(h.p>.55&&!h.didCount){h.didCount=true;state.dodges++;sfx("dodge")}
    if(h.p>=1){
      var ep=edgePoint(h.side,.16+Math.random()*.68);
      h.ax=ep.x;h.ay=ep.y;h.tipX=ep.x;h.tipY=ep.y;
      h.phase="wait";h.timer=Math.max(.18,.72-state.elapsed*.008)+Math.random()*.45;
    }
  }
}
function syncHands(){
  var n=desiredHandCount(state.elapsed);
  while(state.hands.length<n){
    var used=state.hands.map(function(h){return h.side}),side=0;
    for(var i=0;i<4;i++)if(used.indexOf(i)<0){side=i;break}
    state.hands.push(createHand(side));
    state.maxHands=Math.max(state.maxHands,state.hands.length);
  }
}
function updateCandy(dt){
  var c=state.candy;
  var ox=c.x,oy=c.y;
  var follow=c.drag?Math.min(1,dt*18):Math.min(1,dt*8);
  c.x=lerp(c.x,c.targetX,follow);c.y=lerp(c.y,c.targetY,follow);
  c.x=clamp(c.x,c.r+12,W-c.r-12);c.y=clamp(c.y,c.r+24,H-c.r-38);
  c.vx=(c.x-ox)/Math.max(dt,.001);c.vy=(c.y-oy)/Math.max(dt,.001);
}

function drawBackground(){
  // Entire playfield is a simple wooden tabletop. No scenery competing with the candy.
  ctx.fillStyle="#704a3d";ctx.fillRect(0,0,W,H);
  var plank=95;
  for(var y=0;y<H;y+=plank){
    ctx.fillStyle=(Math.floor(y/plank)%2)?"#744c3e":"#6b463a";
    ctx.fillRect(0,y,W,plank);
    ctx.fillStyle="rgba(38,22,25,.25)";ctx.fillRect(0,y, W,3);
    // sparse wood grain only
    ctx.strokeStyle="rgba(255,214,177,.055)";ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(25+(y%71),y+31);ctx.bezierCurveTo(170,y+17,290,y+48,430,y+30);
    ctx.bezierCurveTo(540,y+18,650,y+42,735,y+27);ctx.stroke();
  }
  ctx.fillStyle="rgba(10,8,16,.18)";ctx.fillRect(0,0,16,H);ctx.fillRect(W-16,0,16,H);
}
function drawCandy(c){
  ctx.save();ctx.translate(c.x,c.y);
  ctx.globalAlpha=.22;ctx.fillStyle="#22151b";ctx.beginPath();ctx.ellipse(3,29,34,10,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  // flat wrapper
  ctx.fillStyle="#80b58f";ctx.strokeStyle="#17111d";ctx.lineWidth=5;ctx.lineJoin="round";
  ctx.beginPath();ctx.moveTo(-45,-8);ctx.lineTo(-27,-22);ctx.lineTo(-23,19);ctx.lineTo(-45,9);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(45,-8);ctx.lineTo(27,-22);ctx.lineTo(23,19);ctx.lineTo(45,9);ctx.closePath();ctx.fill();ctx.stroke();
  // candy body
  ctx.beginPath();ctx.arc(0,0,29,0,Math.PI*2);ctx.fillStyle="#ef759c";ctx.fill();ctx.stroke();
  ctx.strokeStyle="#ffd6e1";ctx.lineWidth=7;
  ctx.beginPath();ctx.arc(0,0,17,-1.0,.35);ctx.stroke();
  // stupid little face
  ctx.fillStyle="#3b2231";ctx.beginPath();ctx.arc(-9,4,3.5,0,Math.PI*2);ctx.arc(9,4,3.5,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#3b2231";ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,9,7,.15,Math.PI-.15);ctx.stroke();
  ctx.restore();
}
function handCurvePoint(h,t,tipX,tipY){
  var x=lerp(h.ax,tipX,t),y=lerp(h.ay,tipY,t);
  var dx=tipX-h.ax,dy=tipY-h.ay,n=norm(dx,dy),px=-n.y,py=n.x;
  var amp=h.amp||0,off=0;
  if(h.pattern==="curve")off=Math.sin(Math.PI*t)*amp*.72*h.spin;
  else if(h.pattern==="s")off=Math.sin(Math.PI*2*t)*amp*.80*h.spin;
  else if(h.pattern==="hook")off=Math.sin(Math.PI*t)*amp*h.spin*(.25+t);
  else if(h.pattern==="spiral")off=Math.sin(Math.PI*(h.waves||3)*2*t)*amp*h.spin*(.95-.25*t);
  x+=px*off;y+=py*off;
  return{x:x,y:y};
}
function strokeRubberArm(h,tipX,tipY,width,color){
  ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap="round";ctx.lineJoin="round";
  ctx.beginPath();
  for(var i=0;i<=28;i++){
    var t=i/28,p=handCurvePoint(h,t,tipX,tipY);
    if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);
  }
  ctx.stroke();
}
function drawHand(h){
  if(h.phase==="wait")return;
  var tipX=(h.phase==="aim")?h.tx:h.tipX,tipY=(h.phase==="aim")?h.ty:h.tipY;
  if(h.phase==="aim"){
    // Only a small target marker. No decorative prediction line.
    ctx.save();ctx.globalAlpha=.45;ctx.strokeStyle=h.color;ctx.lineWidth=4;ctx.setLineDash([8,8]);
    ctx.beginPath();ctx.arc(h.tx,h.ty,30,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.restore();
    return;
  }
  var dx=tipX-h.ax,dy=tipY-h.ay,n=norm(dx,dy),px=-n.y,py=n.x;
  ctx.save();
  // ridiculous rubber-hose arm: deliberately allowed to cross itself and other arms
  strokeRubberArm(h,tipX,tipY,44,"#17111d");
  strokeRubberArm(h,tipX,tipY,34,h.color);

  // very simple palm
  ctx.fillStyle=h.color;ctx.strokeStyle="#17111d";ctx.lineWidth=5;
  ctx.beginPath();ctx.ellipse(tipX,tipY,29,25,Math.atan2(dy,dx),0,Math.PI*2);ctx.fill();ctx.stroke();

  // three long cartoon fingers
  ctx.lineCap="round";
  [-1,0,1].forEach(function(k){
    var bx=tipX+px*k*12+n.x*6,by=tipY+py*k*12+n.y*6;
    var spread=k*7;
    var ex=bx+n.x*(29+(k===0?5:0))+px*spread,ey=by+n.y*(29+(k===0?5:0))+py*spread;
    ctx.strokeStyle="#17111d";ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(ex,ey);ctx.stroke();
    ctx.strokeStyle=h.color;ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(ex,ey);ctx.stroke();
    // dumb black nail
    ctx.fillStyle="#17111d";ctx.beginPath();ctx.arc(ex,ey,4.5,0,Math.PI*2);ctx.fill();
  });

  // cuff: one blocky shape only
  var cx=tipX-n.x*30,cy=tipY-n.y*30;
  ctx.fillStyle="#2c2436";ctx.strokeStyle="#17111d";ctx.lineWidth=5;
  ctx.beginPath();
  ctx.moveTo(cx+px*23,cy+py*23);ctx.lineTo(cx-px*23,cy-py*23);
  ctx.lineTo(cx-n.x*20-px*19,cy-n.y*20-py*19);ctx.lineTo(cx-n.x*20+px*19,cy-n.y*20+py*19);
  ctx.closePath();ctx.fill();ctx.stroke();

  // spiral attack gets two tiny motion loops so the stupidity reads immediately
  if(h.pattern==="spiral"){
    ctx.globalAlpha=.45;ctx.strokeStyle="#f4e5d3";ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(tipX-n.x*55,tipY-n.y*55,22,0,Math.PI*1.5);ctx.stroke();
    ctx.beginPath();ctx.arc(tipX-n.x*80,tipY-n.y*80,13,0,Math.PI*1.5);ctx.stroke();
  }
  ctx.restore();
}
function draw(){
  drawBackground();
  if(state){
    state.hands.forEach(drawHand);
    drawCandy(state.candy);

  }
}
function frame(ts){
  if(!last)last=ts;var dt=Math.min(.035,(ts-last)/1000);last=ts;
  if(state&&state.running){
    state.elapsed+=dt;syncHands();updateCandy(dt);
    for(var i=0;i<state.hands.length&&state.running;i++)updateHand(state.hands[i],dt);
    updateHud();
  }
  draw();raf=requestAnimationFrame(frame);
}
function startGame(){
  var n=cleanName(nickname.value);if(!n){nickname.focus();return}
  state={name:n,running:true,elapsed:0,dodges:0,maxHands:1,candy:newCandy(),hands:[createHand(Math.floor(Math.random()*4))]};
  last=performance.now();startOverlay.classList.add("hidden");overOverlay.classList.add("hidden");tipbar.textContent="사탕을 잡고 움직이세요";
  unlockAudio(function(){sfx("start");startBgm()});updateHud();
}
function endGame(){
  if(!state||!state.running)return;
  state.running=false;stopBgm();sfx("caught");saveScore();renderRanks();updateHud();
  var rec=getBest(state.name);
  document.getElementById("rTime").textContent=fmt(state.elapsed)+"초";
  document.getElementById("rDodge").textContent=state.dodges;
  document.getElementById("rHands").textContent=state.maxHands;
  document.getElementById("rBest").textContent=fmt(rec?rec.time:state.elapsed)+"초";
  overOverlay.classList.remove("hidden");
}
function canvasPos(e){
  var r=cv.getBoundingClientRect(),sx=W/r.width,sy=H/r.height;
  return{x:(e.clientX-r.left)*sx,y:(e.clientY-r.top)*sy};
}
cv.addEventListener("pointerdown",function(e){
  if(!state||!state.running)return;var p=canvasPos(e),c=state.candy;
  if(dist(p.x,p.y,c.x,c.y)<80){
    c.drag=true;cv.setPointerCapture(e.pointerId);sfx("grab");
    c.targetX=p.x;c.targetY=p.y-(e.pointerType==="touch"?46:0);
    tipbar.textContent="뺏기지 마!";
  }
});
cv.addEventListener("pointermove",function(e){
  if(!state||!state.running||!state.candy.drag)return;var p=canvasPos(e),c=state.candy;
  c.targetX=p.x;c.targetY=p.y-(e.pointerType==="touch"?46:0);
});
function release(e){if(state&&state.candy)state.candy.drag=false}
cv.addEventListener("pointerup",release);cv.addEventListener("pointercancel",release);
document.getElementById("startBtn").onclick=startGame;
document.getElementById("retryBtn").onclick=function(){overOverlay.classList.add("hidden");startGame()};
document.getElementById("homeBtn").onclick=function(){overOverlay.classList.add("hidden");startOverlay.classList.remove("hidden");if(state)state.running=false;stopBgm()};
nickname.addEventListener("keydown",function(e){if(e.key==="Enter")startGame()});
document.addEventListener("pointerdown",function(){if(soundOn)unlockAudio(function(){})},{once:true,passive:true});
renderRanks();draw();raf=requestAnimationFrame(frame);
})();
</script>
</body>
