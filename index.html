<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오늘 뭐 먹지? · 메뉴 자판기</title><meta name="description" content="한식부터 디저트까지, 버튼을 눌러 오늘의 메뉴를 뽑아 보세요."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='2' width='24' height='28' rx='3' fill='%23ED3B49'/%3E%3Cpath d='M8 7h16v9H8z' fill='%2379D8BE'/%3E%3Cpath d='M9 23h14v4H9z' fill='%23482333'/%3E%3C/svg%3E"><style>
@import url('https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css');
:root{--cream:#fff4d6;--red:#ed3b49;--mint:#79d8be;--yellow:#ffd34e;--ink:#482333}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Galmuri11,monospace;background-image:radial-gradient(#ed3b4930 2px,transparent 2px);background-size:24px 24px;min-height:100svh}button{font:inherit;color:inherit;cursor:pointer}main{max-width:940px;margin:auto;padding:28px 22px 36px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;font-size:14px}.brand{font-weight:700;letter-spacing:2px}.pill{border:2px solid var(--ink);background:var(--mint);padding:7px 12px;box-shadow:3px 3px var(--ink)}.layout{display:grid;grid-template-columns:1fr 320px;gap:34px;align-items:center}.machine{background:var(--red);border:5px solid var(--ink);box-shadow:9px 9px var(--ink);padding:20px;border-radius:14px 14px 3px 3px;position:relative}.marquee{background:var(--cream);border:4px solid var(--ink);padding:17px 6px;text-align:center;box-shadow:inset 0 -5px #e5d1a6}h1{font-size:clamp(23px,5vw,34px);margin:0 0 7px;font-weight:900}.marquee small{font-size:13px;letter-spacing:2px}.window{margin-top:17px;background:var(--mint);border:4px solid var(--ink);padding:13px;box-shadow:inset 5px 5px #328572}.shelves{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px}.item{background:#fff4d6dc;text-align:center;border:2px solid var(--ink);padding:9px 3px 6px;box-shadow:3px 3px #48233380}.item span{font-size:32px;display:block;line-height:1.4}.item small{font-size:12px}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:17px 0}.controls button{background:var(--yellow);border:3px solid var(--ink);font-weight:700;min-height:49px;box-shadow:3px 4px var(--ink);font-size:16px}.controls button:nth-child(even){background:var(--mint)}button:hover{filter:brightness(1.05)}.controls button:active,.controls button.active{transform:translate(3px,3px);box-shadow:none;background:var(--cream)}button:focus-visible{outline:3px solid white;outline-offset:4px}button:disabled{cursor:wait}.bottom{display:flex;gap:12px;align-items:center}.slot{background:#301622;border:3px solid var(--ink);height:79px;flex:1;position:relative;overflow:hidden;box-shadow:inset 0 8px #160e15}.flap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:3px;color:#fff4d685}.ticket{position:absolute;background:var(--cream);border:3px solid var(--ink);left:18%;width:64%;top:100%;padding:12px 4px;text-align:center;font-size:14px;transition:top .55s steps(7);z-index:1}.slot.dispense .ticket{top:16px}.coin{border:3px solid var(--ink);background:var(--cream);width:54px;height:79px;display:flex;align-items:center;justify-content:center}.coin:before{content:'';height:32px;width:7px;background:var(--ink)}.feet{display:flex;justify-content:space-between;padding:0 20px}.feet i{width:38px;height:13px;background:var(--ink)}.result{position:relative;border:3px solid var(--ink);background:var(--cream);padding:24px 20px;box-shadow:7px 7px var(--ink);text-align:center;min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center}.result:before{content:'YOUR MENU';position:absolute;top:-16px;background:var(--yellow);border:2px solid var(--ink);padding:5px 13px;font-size:13px;transform:rotate(-4deg)}.result .icon{font-size:58px;line-height:1.3;margin:12px 0}.category{font-size:14px;background:var(--mint);padding:6px 12px;border:2px solid var(--ink)}h2{font-size:25px;line-height:1.6;margin:16px 0;word-break:keep-all}.result p{font-size:14px;line-height:1.9;margin:0}.result button{background:var(--yellow);border:2px solid var(--ink);padding:12px 17px;box-shadow:3px 3px var(--ink);font-size:14px;margin-top:15px}.result button[hidden]{display:none}.note{text-align:center;font-size:12px;margin:24px 0 0;line-height:1.8}.shake{animation:shake .12s steps(2) 6}@keyframes shake{50%{transform:translateX(3px)}}@media(max-width:700px){main{max-width:440px;padding:18px 18px 28px}.top{margin-bottom:18px;font-size:12px}.layout{grid-template-columns:1fr;gap:28px}.machine{padding:15px}.result{min-height:215px;padding:20px 15px}.result .icon{font-size:38px;margin:6px 0}h2{font-size:23px;margin:10px 0}.result p{font-size:14px}.window{padding:10px}.item span{font-size:26px}.controls{gap:8px}.controls button{min-height:46px}.note{margin-top:20px}}@media(prefers-reduced-motion:reduce){.shake{animation:none}.ticket{transition:none}}

.audio-bar{display:flex;justify-content:center;align-items:center;gap:15px;flex-wrap:wrap;margin:23px 0 8px;font-size:14px}.audio-bar button{background:var(--mint);border:2px solid var(--ink);box-shadow:3px 3px var(--ink);padding:10px 14px;min-height:44px}.audio-bar label{display:flex;align-items:center;gap:8px}.audio-bar input{width:90px;accent-color:var(--red)}
</style></head><body><main><header class="top"><span class="brand">MENU-MATIC</span><span class="pill">고민은 짧게, 식사는 맛있게</span></header><div class="layout"><section aria-label="메뉴 추천 자판기"><div class="machine" id="machine"><div class="marquee"><h1>오늘 뭐 먹지?</h1><small>PRESS A BUTTON · PICK A MENU</small></div><div class="window"><div class="shelves"><div class="item"><span aria-hidden="true">🍚</span><small>한식</small></div><div class="item"><span aria-hidden="true">🍕</span><small>양식</small></div><div class="item"><span aria-hidden="true">🍣</span><small>일식</small></div><div class="item"><span aria-hidden="true">🥟</span><small>중식</small></div><div class="item"><span aria-hidden="true">🌮</span><small>기타</small></div><div class="item"><span aria-hidden="true">🍰</span><small>디저트</small></div></div></div><div class="controls" id="controls"></div><div class="bottom"><div class="slot" id="slot"><span class="flap">PICK UP HERE</span><div class="ticket" id="ticket">주문 완료!</div></div><div class="coin" aria-hidden="true"></div></div></div><div class="feet" aria-hidden="true"><i></i><i></i></div></section><section class="result" aria-label="추천 메뉴" aria-live="polite" aria-busy="false" id="result"><span class="category" id="category">메뉴 뽑기</span><div class="icon" id="icon" aria-hidden="true">🍽️</div><h2 id="food">무엇이 당기세요?</h2><p id="message">원하는 카테고리를 눌러 주세요.<br>오늘의 메뉴를 골라 드릴게요.</p><button id="again" hidden>한 번 더 뽑기</button></section></div><div class="audio-bar"><button type="button" id="sound" aria-pressed="false">소리 켜기</button><label for="volume">음량 <input id="volume" type="range" min="0" max="100" value="65"></label></div><p class="note">한식 · 양식 · 일식 · 중식 · 기타 · 디저트<br>각 카테고리 10가지, 총 60가지 메뉴</p></main><script>
const menus={한식:['돼지고기 김치찌개','차돌박이 된장찌개','꼬막비빔밥','제육볶음','뚝배기 소불고기','치즈닭갈비','삼겹살구이','해물 순두부찌개','물냉면','비빔냉면'],양식:['베이컨 크림 파스타','해산물 토마토 파스타','소고기 라자냐','안심 스테이크','페퍼로니 피자','고르곤졸라 피자','더블 치즈버거','버섯 크림 리소토','데미글라스 오므라이스','치킨 클럽 샌드위치'],일식:['연어초밥','참치초밥','등심 돈카츠','돈코츠 라멘','유부우동','냉모밀','규동','가츠동','해물 오코노미야키','새우 텐동'],중식:['간짜장','해물짬뽕','새우볶음밥','잡채밥','마파두부 덮밥','찹쌀탕수육','소고기 마라탕','새우 마라샹궈','고추잡채와 꽃빵','새우 딤섬'],기타:['치즈떡볶이','소고기 쌀국수','새우 팟타이','돼지고기 반미','버터 치킨 커리와 난','양고기 케밥','소고기 타코','치킨 부리토','참치마요 김밥','후라이드 치킨'],디저트:['딸기 생크림 케이크','초콜릿 브라우니','누텔라 바나나 와플','메이플 시럽 크로플','초콜릿 글레이즈 도넛','민트초코 아이스크림','인절미 빙수','커스터드 푸딩','에그타르트','초코칩 쿠키']};
const icons={한식:'🍚',양식:'🍕',일식:'🍣',중식:'🥟',기타:'🌮',디저트:'🍰'};const $=id=>document.getElementById(id);let current=null,busy=false;const previous={};Object.keys(menus).forEach(category=>{const b=document.createElement('button');b.textContent=category;b.type='button';b.addEventListener('click',()=>draw(category));$('controls').append(b)});function draw(category){if(busy)return;audioStart().then(()=>effect('button'));busy=true;current=category;$('result').setAttribute('aria-busy','true');document.querySelectorAll('#controls button').forEach(b=>{b.disabled=true;b.classList.toggle('active',b.textContent===category)});$('again').disabled=true;$('slot').classList.remove('dispense');$('machine').classList.add('shake');$('category').textContent=category;$('food').textContent='메뉴를 고르는 중…';$('message').textContent='잠시만 기다려 주세요.';$('icon').textContent=icons[category];const choices=menus[category].filter(x=>x!==previous[category]);const chosen=choices[Math.floor(Math.random()*choices.length)];setTimeout(()=>{effect('motor');$('ticket').textContent=category+' · 주문 완료';$('slot').classList.add('dispense')},450);setTimeout(()=>{effect('ready');previous[category]=chosen;$('food').textContent=chosen;$('message').textContent='오늘은 이 메뉴 어떠세요?';$('again').hidden=false;$('again').disabled=false;document.querySelectorAll('#controls button').forEach(b=>b.disabled=false);$('machine').classList.remove('shake');$('result').setAttribute('aria-busy','false');busy=false},1100)}$('again').addEventListener('click',()=>{if(current)draw(current)});

let audioContext=null,master=null,musicBus=null,fxBus=null,musicTimer=null,nextBeat=0,beatIndex=0,audioEnabled=false,userMuted=false;
const chords=[[60,64,67,71],[57,60,64,67],[62,65,69,72],[55,59,62,65]];
const melody=[76,null,79,76,74,null,72,71,72,null,76,79,76,74,72,null,77,null,76,74,72,null,74,77,74,null,71,74,72,71,67,null];
function tone(midi,time,duration,level,type,bus){const o=audioContext.createOscillator(),g=audioContext.createGain();o.type=type;o.frequency.value=440*Math.pow(2,(midi-69)/12);g.gain.setValueAtTime(0,time);g.gain.linearRampToValueAtTime(level,time+.009);g.gain.exponentialRampToValueAtTime(.0001,time+duration);o.connect(g);g.connect(bus);o.start(time);o.stop(time+duration+.03);o.onended=()=>{o.disconnect();g.disconnect()};}
function drum(time){const length=Math.floor(audioContext.sampleRate*.045),b=audioContext.createBuffer(1,length,audioContext.sampleRate),d=b.getChannelData(0);for(let i=0;i<length;i++)d[i]=(Math.random()*2-1)*(1-i/length);const n=audioContext.createBufferSource(),g=audioContext.createGain(),f=audioContext.createBiquadFilter();n.buffer=b;f.type='highpass';f.frequency.value=7000;g.gain.value=.035;n.connect(f);f.connect(g);g.connect(musicBus);n.start(time);n.onended=()=>{n.disconnect();f.disconnect();g.disconnect()};}
function scheduleMusic(){if(!audioEnabled||document.hidden||audioContext.state!=='running')return;const now=audioContext.currentTime;if(nextBeat<now)nextBeat=now+.04;while(nextBeat<now+.16){const step=beatIndex%32,within=step%8,chord=chords[Math.floor(step/8)],t=nextBeat;if(within%2===0){tone(chord[0]-24,t,.28,.13,'triangle',musicBus);if(within===4)tone(chord[2]-24,t,.28,.09,'triangle',musicBus);}if(within===0||within===3||within===6)chord.forEach((n,i)=>tone(n,t+i*.014,.28,.035,'triangle',musicBus));if(melody[step]!=null)tone(melody[step],t,.19,.04,'square',musicBus);drum(t);nextBeat+=within%2===0?.20:.13;beatIndex++;}}
function updateSound(){document.getElementById('sound').textContent=audioEnabled?'소리 끄기':'소리 켜기';document.getElementById('sound').setAttribute('aria-pressed',String(audioEnabled));}
async function audioStart(explicit=false){if(userMuted&&!explicit)return;try{if(!audioContext){const Context=window.AudioContext||window.webkitAudioContext;if(!Context)return;audioContext=new Context();master=audioContext.createGain();master.gain.value=Number(document.getElementById('volume').value)/100;master.connect(audioContext.destination);musicBus=audioContext.createGain();musicBus.gain.value=.65;musicBus.connect(master);fxBus=audioContext.createGain();fxBus.gain.value=.65;fxBus.connect(master);}if(explicit)userMuted=false;audioEnabled=true;await audioContext.resume();if(!audioEnabled||document.hidden){if(!audioEnabled)await audioContext.suspend();return;}nextBeat=audioContext.currentTime+.04;if(musicTimer===null)musicTimer=setInterval(scheduleMusic,60);scheduleMusic();updateSound();}catch(e){audioEnabled=false;updateSound();}}
function effect(kind){if(!audioEnabled||!audioContext||audioContext.state!=='running')return;const t=audioContext.currentTime;if(kind==='button'){tone(84,t,.07,.11,'square',fxBus);}else if(kind==='motor'){[43,45,43,47,43].forEach((n,i)=>tone(n,t+i*.075,.08,.085,'sawtooth',fxBus));}else{[72,76,79,84].forEach((n,i)=>tone(n,t+i*.075,.22,.105,'triangle',fxBus));}}
document.getElementById('sound').addEventListener('click',async()=>{if(audioEnabled){audioEnabled=false;userMuted=true;clearInterval(musicTimer);musicTimer=null;updateSound();if(audioContext)await audioContext.suspend();}else{await audioStart(true);effect('button');}});
document.getElementById('volume').addEventListener('input',e=>{if(master)master.gain.setTargetAtTime(Number(e.target.value)/100,audioContext.currentTime,.025);});
document.addEventListener('visibilitychange',async()=>{if(!audioContext)return;if(document.hidden){await audioContext.suspend();}else if(audioEnabled){try{await audioContext.resume();nextBeat=audioContext.currentTime+.04;}catch(e){}}});
</script></body></html>
